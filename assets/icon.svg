<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b7a6b"/>
      <stop offset="100%" stop-color="#075e54"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#0f172a"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer Comic Chat Bubble -->
  <path d="M110 130 C110 90, 140 70, 256 70 C372 70, 402 90, 402 130 L402 290 C402 330, 372 350, 256 350 L200 350 L140 410 L150 350 C120 345, 110 325, 110 290 Z" 
        fill="#ffffff" stroke="#0f172a" stroke-width="14" stroke-linejoin="round" filter="url(#shadow)"/>
        
  <!-- Accent Speech Lines / Lightning Bolt -->
  <path d="M240 130 L210 225 L265 225 L230 310 L315 205 L260 205 Z" 
        fill="#facc15" stroke="#0f172a" stroke-width="10" stroke-linejoin="round"/>
        
  <!-- Comic Sparkles -->
  <circle cx="345" cy="140" r="14" fill="#00a884" stroke="#0f172a" stroke-width="6"/>
  <circle cx="165" cy="150" r="10" fill="#f43f5e" stroke="#0f172a" stroke-width="5"/>
</svg>
