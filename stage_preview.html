<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Manhwa Motion Stage — Clean Visual Sample</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Bangers&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050508;
    color: #f8fafc;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
  }

  /* ═══════════════════════════════════════════════════
     STAGE CONTAINER (FULLSCREEN OR ROTATED 16:9 VIEW)
     ═══════════════════════════════════════════════════ */
  #stageApp {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    background: #020205;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ATMOSPHERIC DYNAMIC BACKGROUND */
  .dynamic-bg {
    position: absolute;
    inset: 0;
    z-index: 1;
    transition: background 0.8s ease, filter 0.8s ease;
  }

  .mood-calm {
    background: radial-gradient(circle at 50% 20%, #0c4a6e 0%, #071a2e 50%, #020617 100%);
  }
  .mood-tense {
    background: radial-gradient(circle at 50% 30%, #450a0a 0%, #1a0505 55%, #020205 100%);
  }
  .mood-epic {
    background: radial-gradient(circle at 50% 25%, #3b0764 0%, #17072b 55%, #05020a 100%);
  }
  .mood-warm {
    background: radial-gradient(circle at 50% 30%, #78350f 0%, #291003 55%, #050201 100%);
  }

  /* AMBIENT FLOATING DUST PARTICLES */
  .particle-canvas {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* SUBTLE VIGNETTE */
  .cinema-vignette {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.75);
  }

  /* ═══════════════════════════════════════════════════
     LIVING FULL-BODY / BUST CHARACTER ACTOR
     ═══════════════════════════════════════════════════ */
  .actor-container {
    position: absolute;
    bottom: 0;
    z-index: 10;
    pointer-events: none;
    transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* LEFT SPEAKER PLACEMENT */
  .actor-left {
    left: -2%;
  }

  /* RIGHT SPEAKER PLACEMENT */
  .actor-right {
    right: -2%;
  }

  /* FULL BODY MODE (Default) */
  .view-full-body .actor-container {
    width: 60%;
    max-width: 380px;
    height: 82vh;
  }
  .view-full-body .actor-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom center;
    filter: drop-shadow(0 15px 35px rgba(0,0,0,0.85));
  }

  /* BUST ZOOM MODE (Toggleable via button) */
  .view-bust .actor-container {
    width: 82%;
    max-width: 520px;
    height: 95vh;
  }
  .view-bust .actor-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transform: translateY(12%);
    filter: drop-shadow(0 20px 45px rgba(0,0,0,0.9));
  }

  /* SUBTLE IDLE BREATHING SINE */
  .actor-container.breathing img {
    animation: livingBreath 3.6s ease-in-out infinite alternate;
  }
  @keyframes livingBreath {
    0% { transform: translateY(0) scaleY(1); }
    100% { transform: translateY(-4px) scaleY(1.008); }
  }

  /* SOFT BLEND AT BOTTOM FEET */
  .actor-blend-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 14%;
    background: linear-gradient(to top, rgba(2,2,5,0.95) 0%, transparent 100%);
    pointer-events: none;
    z-index: 12;
  }

  /* ═══════════════════════════════════════════════════
     MINI BABY CHIBI STICKER PLACEHOLDER (NEAR HEAD)
     ═══════════════════════════════════════════════════ */
  .chibi-sticker-anchor {
    position: absolute;
    top: 14%;
    z-index: 25;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 6px;
    animation: chibiPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .actor-left .chibi-sticker-anchor {
    right: -25px;
  }
  .actor-right .chibi-sticker-anchor {
    left: -25px;
  }

  @keyframes chibiPop {
    0% { transform: scale(0.4) translateY(15px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* CUTE COMIC CHIBI STICKER BUBBLE */
  .mini-chibi-pill {
    background: #ffffff;
    color: #0f172a;
    border: 2px dashed #38bdf8;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 10.5px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  .mini-chibi-pill .chibi-avatar-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fef08a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    border: 1.5px solid #0f172a;
  }

  /* ═══════════════════════════════════════════════════
     MANGA SPEECH BUBBLES (MIX OF 3 AUTHENTIC STYLES)
     ═══════════════════════════════════════════════════ */
  .speech-bubble-anchor {
    position: absolute;
    z-index: 30;
    top: 20%;
    max-width: 58%;
    min-width: 210px;
    animation: bubbleSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes bubbleSlideIn {
    0% { opacity: 0; transform: translateY(14px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* LEFT SPEAKER -> Bubble floats on Right */
  .bubble-for-left-speaker {
    right: 5%;
  }

  /* RIGHT SPEAKER -> Bubble floats on Left */
  .bubble-for-right-speaker {
    left: 5%;
  }

  /* --- STYLE 1: CLEAN CRISP WHITE BUBBLE (NORMAL) --- */
  .bubble-normal {
    background: rgba(255, 255, 255, 0.98);
    color: #0f172a;
    border-radius: 22px;
    padding: 16px 18px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    border: 2px solid #e2e8f0;
    position: relative;
  }

  /* --- STYLE 2: JAGGED SHOUT BUBBLE (ANGRY / ATTACK) --- */
  .bubble-shout {
    background: #fff1f2;
    color: #450a0a;
    border: 3px solid #dc2626;
    border-radius: 12px;
    padding: 16px 18px;
    position: relative;
    box-shadow: 0 0 30px rgba(220, 38, 38, 0.4);
    clip-path: polygon(
      0% 8%, 4% 0%, 12% 6%, 20% 0%, 28% 5%, 36% 0%, 45% 6%, 55% 0%, 65% 5%, 75% 0%, 85% 6%, 95% 0%, 100% 8%,
      96% 25%, 100% 40%, 95% 55%, 100% 70%, 96% 85%, 100% 92%,
      95% 100%, 85% 94%, 75% 100%, 65% 95%, 55% 100%, 45% 94%, 35% 100%, 25% 95%, 15% 100%, 5% 94%, 0% 92%,
      4% 75%, 0% 60%, 5% 45%, 0% 30%, 4% 15%
    );
  }

  /* --- STYLE 3: OBSIDIAN DARK AURA BUBBLE (ARISE / EPIC) --- */
  .bubble-dark {
    background: linear-gradient(135deg, #090614 0%, #1e1035 100%);
    color: #f8fafc;
    border: 2px solid #a855f7;
    border-radius: 22px;
    padding: 16px 18px;
    position: relative;
    box-shadow: 0 0 35px rgba(168, 85, 247, 0.45), inset 0 0 15px rgba(0, 240, 255, 0.2);
  }

  /* ORGANIC DIRECTIONAL TAILS */
  .bubble-tail {
    position: absolute;
    width: 0;
    height: 0;
    border-style: solid;
  }

  /* Left Speaker tail pointing Left */
  .bubble-for-left-speaker .bubble-tail {
    left: -14px;
    top: 26px;
    border-width: 9px 15px 9px 0;
    border-color: transparent rgba(255,255,255,0.98) transparent transparent;
  }
  .bubble-for-left-speaker .bubble-dark .bubble-tail {
    border-color: transparent #a855f7 transparent transparent;
  }

  /* Right Speaker tail pointing Right */
  .bubble-for-right-speaker .bubble-tail {
    right: -14px;
    top: 26px;
    border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent rgba(255,255,255,0.98);
  }
  .bubble-for-right-speaker .bubble-dark .bubble-tail {
    border-color: transparent transparent transparent #a855f7;
  }

  .speaker-title-tag {
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 5px;
    display: inline-block;
  }

  .bubble-normal .speaker-title-tag { color: #0284c7; }
  .bubble-shout .speaker-title-tag { color: #dc2626; font-size: 12px; }
  .bubble-dark .speaker-title-tag { color: #38bdf8; text-shadow: 0 0 8px rgba(0,240,255,0.6); }

  .bubble-text-content {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: -0.15px;
  }

  .bubble-text-content mark {
    background: #fca5a5;
    color: #991b1b;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 900;
  }

  .bubble-dark .bubble-text-content mark {
    background: #a855f7;
    color: #ffffff;
    box-shadow: 0 0 10px #c084fc;
  }

  /* ═══════════════════════════════════════════════════
     SYSTEM QUEST / NARRATION CARD
     ═══════════════════════════════════════════════════ */
  .system-quest-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 86%;
    max-width: 440px;
    z-index: 40;
    text-align: center;
    animation: questPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes questPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .quest-card {
    background: rgba(6, 15, 30, 0.94);
    border: 2px solid #00f0ff;
    border-radius: 20px;
    padding: 20px 24px;
    box-shadow: 0 0 45px rgba(0, 240, 255, 0.45), inset 0 0 20px rgba(0, 240, 255, 0.15);
    backdrop-filter: blur(8px);
  }

  /* ═══════════════════════════════════════════════════
     MINIMAL DISCREET FLOATING HUD (NO UGLY TOOLBAR!)
     ═══════════════════════════════════════════════════ */
  .top-floating-hud {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  .hud-badge-soft {
    font-size: 11px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.75);
    background: rgba(0, 0, 0, 0.45);
    padding: 4px 12px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .floating-tools {
    display: flex;
    gap: 6px;
    pointer-events: all;
  }

  .hud-btn {
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #f8fafc;
    font-size: 11.5px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .hud-btn:hover {
    background: rgba(30, 41, 59, 0.85);
  }
  .hud-btn.active {
    background: #0284c7;
    border-color: #38bdf8;
  }

  .bottom-tap-hint {
    position: absolute;
    bottom: 16px;
    left: 20px;
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
    z-index: 50;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* ═══════════════════════════════════════════════════
     LANDSCAPE 16:9 ROTATED MODE (ZERO OVERLAP)
     ═══════════════════════════════════════════════════ */
  @media (orientation: landscape) {
    .actor-container {
      width: 35% !important;
      max-width: 340px !important;
      height: 92vh !important;
    }
    .speech-bubble-anchor {
      max-width: 44% !important;
      top: 24% !important;
    }
  }

  /* Mobile narrow screen adjustments */
  @media (max-width: 480px) {
    .speech-bubble-anchor { max-width: 62%; }
    .bubble-text-content { font-size: 14px; }
  }
</style>
</head>
<body class="view-full-body">

<div id="stageApp" onclick="handleTapAdvance(event)">
  <!-- DYNAMIC BACKGROUND -->
  <div class="dynamic-bg mood-calm" id="stageBg"></div>

  <!-- FLOATING PARTICLES CANVAS -->
  <canvas class="particle-canvas" id="particleCanvas"></canvas>

  <!-- CINEMA VIGNETTE -->
  <div class="cinema-vignette"></div>

  <!-- TOP DISCREET CONTROLS (MINIMAL & IMMERSIVE) -->
  <div class="top-floating-hud">
    <div class="hud-badge-soft" id="turnIndicator">Scene 1 / 6</div>
    
    <div class="floating-tools">
      <!-- 1. TOGGLE FULL-BODY VS BUST VIEW -->
      <button type="button" class="hud-btn" id="viewToggleBtn" onclick="event.stopPropagation(); toggleBodyView();" title="Toggle Full-body vs Bust Zoom">
        <span id="viewModeLabel">👤 Bust Zoom</span>
      </button>

      <!-- 2. AUTO-PLAY TOGGLE -->
      <button type="button" class="hud-btn" id="autoPlayBtn" onclick="event.stopPropagation(); toggleAutoPlay();">
        <span id="autoLabel">▶ Auto</span>
      </button>

      <!-- 3. RESTART -->
      <button type="button" class="hud-btn" onclick="event.stopPropagation(); restartScene();">
        <span>↺</span>
      </button>
    </div>
  </div>

  <!-- LIVING CHARACTER LAYER (FULL BODY CUTOUT FLOATING ON AIR) -->
  <div class="actor-container actor-left breathing" id="actorContainer">
    <img src="assets/characters/anime_girl_body.png" alt="Character Cutout" id="actorImg">
    <div class="actor-blend-fade"></div>

    <!-- MINI BABY CHIBI REACTION STICKER (PLACEHOLDER ANCHOR) -->
    <div class="chibi-sticker-anchor" id="chibiAnchor">
      <div class="mini-chibi-pill">
        <span class="chibi-avatar-circle" id="chibiEmoji">✨</span>
        <span id="chibiText">[Chibi Sticker]</span>
      </div>
    </div>
  </div>

  <!-- MANGA SPEECH BUBBLE ANCHOR -->
  <div class="speech-bubble-anchor bubble-for-left-speaker" id="bubbleAnchor">
    <div class="bubble-normal" id="speechBubble">
      <div class="bubble-tail"></div>
      <span class="speaker-title-tag" id="speakerLabel">Cha Hae-In</span>
      <div class="bubble-text-content" id="dialogueText">
        The Dungeon readings are fluctuating. An irregular mana core is active inside.
      </div>
    </div>
  </div>

  <!-- SYSTEM QUEST OVERLAY (DROPS IN WHEN ACTIVE) -->
  <div class="system-quest-overlay" id="questOverlay" style="display:none;">
    <div class="quest-card">
      <div style="font-size:10.5px; font-weight:900; color:#00f0ff; letter-spacing:2px; margin-bottom:8px;">❖ URGENT SYSTEM QUEST</div>
      <div style="font-size:14.5px; font-weight:800; color:#ffffff; line-height:1.45;" id="questContent">
        SURVIVAL MISSION: Clear the S-Rank Dungeon gate before the barrier collapses!
      </div>
    </div>
  </div>

  <!-- BOTTOM HINT -->
  <div class="bottom-tap-hint" id="tapHint">Tap anywhere to advance • or press Auto</div>
</div>

<script>
  /* ═══════════════════════════════════════════════════
     STORY SCRIPT WITH MIXED BUBBLE STYLES & MOODS
     ═══════════════════════════════════════════════════ */
  const storyScript = [
    {
      turn: 1,
      speaker: 'left',
      name: 'Cha Hae-In',
      img: 'assets/characters/anime_girl_body.png',
      mood: 'calm',
      bubbleStyle: 'normal',
      chibiEmoji: '✨',
      chibiText: '[Your Chibi: Confident]',
      text: 'The Dungeon readings are fluctuating. An irregular mana core is active inside.'
    },
    {
      turn: 2,
      speaker: 'right',
      name: 'Barbarian King',
      img: 'assets/characters/knight_cutout.png',
      mood: 'warm',
      bubbleStyle: 'normal',
      chibiEmoji: '🛡️',
      chibiText: '[Your Chibi: Smirk]',
      text: 'Good. A hunter who runs from danger has no business holding a blade.'
    },
    {
      turn: 3,
      speaker: 'system',
      name: 'SYSTEM',
      mood: 'tense',
      bubbleStyle: 'quest',
      questText: '⚡ SYSTEM ALERT: The Dungeon entrance has collapsed! Time remaining: 180s'
    },
    {
      turn: 4,
      speaker: 'right',
      name: 'Barbarian King',
      img: 'assets/characters/knight_cutout.png',
      mood: 'tense',
      bubbleStyle: 'shout',
      chibiEmoji: '💢',
      chibiText: '[Your Chibi: Angry]',
      text: 'AN ENTRANCE COLLAPSE?! <mark>WE ARE TRAPPED HERE WITH THE BOSS?!</mark>'
    },
    {
      turn: 5,
      speaker: 'left',
      name: 'Cha Hae-In',
      img: 'assets/characters/anime_girl_body.png',
      mood: 'tense',
      bubbleStyle: 'normal',
      chibiEmoji: '😱',
      chibiText: '[Your Chibi: Shocked]',
      text: 'Wait... look below his feet. That dark shadow mist rising... it is taking human form!'
    },
    {
      turn: 6,
      speaker: 'left',
      name: 'Cha Hae-In',
      img: 'assets/characters/anime_girl_body.png',
      mood: 'epic',
      bubbleStyle: 'dark',
      chibiEmoji: '😈',
      chibiText: '[Your Chibi: Arise]',
      text: 'The Shadow Monarch has answered. Rise from the abyss of death... <mark>ARISE.</mark>'
    }
  ];

  let currentIdx = 0;
  let isAutoPlay = false;
  let autoTimer = null;
  let isBustMode = false;

  /* RENDER SCENE TURN */
  function renderTurn(index) {
    if (index < 0) index = 0;
    if (index >= storyScript.length) index = storyScript.length - 1;
    currentIdx = index;

    const data = storyScript[index];
    document.getElementById('turnIndicator').textContent = `Scene ${index + 1} / ${storyScript.length}`;

    const bg = document.getElementById('stageBg');
    bg.className = `dynamic-bg mood-${data.mood || 'calm'}`;

    const actorCont = document.getElementById('actorContainer');
    const bubbleAnchor = document.getElementById('bubbleAnchor');
    const questOverlay = document.getElementById('questOverlay');

    // System Alert Handling
    if (data.speaker === 'system') {
      questOverlay.style.display = 'block';
      document.getElementById('questContent').textContent = data.questText;
      actorCont.style.opacity = '0.35';
      bubbleAnchor.style.opacity = '0';
      return;
    }

    questOverlay.style.display = 'none';
    actorCont.style.opacity = '1';
    bubbleAnchor.style.opacity = '1';

    // Position Character and Bubble
    const isLeft = data.speaker === 'left';
    actorCont.className = `actor-container ${isLeft ? 'actor-left' : 'actor-right'} breathing`;
    document.getElementById('actorImg').src = data.img;

    bubbleAnchor.className = `speech-bubble-anchor ${isLeft ? 'bubble-for-left-speaker' : 'bubble-for-right-speaker'}`;

    // Apply Speech Bubble Style (Normal / Shout / Dark)
    const bubbleEl = document.getElementById('speechBubble');
    bubbleEl.className = data.bubbleStyle === 'shout' ? 'bubble-shout' :
                         (data.bubbleStyle === 'dark' ? 'bubble-dark' : 'bubble-normal');

    document.getElementById('speakerLabel').textContent = data.name;
    document.getElementById('dialogueText').innerHTML = data.text;

    // Mini Baby Chibi Sticker Placeholder
    document.getElementById('chibiEmoji').textContent = data.chibiEmoji || '✨';
    document.getElementById('chibiText').textContent = data.chibiText || '[Your Chibi Sticker]';
  }

  /* TOGGLE FULL BODY VS BUST ZOOM */
  function toggleBodyView() {
    isBustMode = !isBustMode;
    const body = document.body;
    const label = document.getElementById('viewModeLabel');
    const btn = document.getElementById('viewToggleBtn');

    if (isBustMode) {
      body.className = 'view-bust';
      label.textContent = '🧍 Full Body';
      btn.classList.add('active');
    } else {
      body.className = 'view-full-body';
      label.textContent = '👤 Bust Zoom';
      btn.classList.remove('active');
    }
  }

  /* AUTO-PLAY CONTROLLER */
  function toggleAutoPlay() {
    isAutoPlay = !isAutoPlay;
    const btn = document.getElementById('autoPlayBtn');
    const label = document.getElementById('autoLabel');
    const hint = document.getElementById('tapHint');

    if (isAutoPlay) {
      label.textContent = '⏸ Pause';
      btn.classList.add('active');
      hint.style.opacity = '0';
      startAutoCycle();
    } else {
      label.textContent = '▶ Auto';
      btn.classList.remove('active');
      hint.style.opacity = '1';
      if (autoTimer) clearTimeout(autoTimer);
      autoTimer = null;
    }
  }

  function startAutoCycle() {
    if (!isAutoPlay) return;
    const data = storyScript[currentIdx];
    const textLen = (data.text || data.questText || '').length;
    const delay = Math.max(2400, Math.min(textLen * 50, 5200));

    autoTimer = setTimeout(() => {
      if (!isAutoPlay) return;
      if (currentIdx < storyScript.length - 1) {
        renderTurn(currentIdx + 1);
        startAutoCycle();
      } else {
        renderTurn(0);
        startAutoCycle();
      }
    }, delay);
  }

  function handleTapAdvance(e) {
    if (e.target.closest('.floating-tools')) return;
    if (currentIdx < storyScript.length - 1) {
      renderTurn(currentIdx + 1);
    } else {
      renderTurn(0);
    }
  }

  function restartScene() {
    if (isAutoPlay) toggleAutoPlay();
    renderTurn(0);
  }

  /* FLOATING DUST PARTICLES ENGINE */
  function initParticles() {
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 28 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.6,
      speedY: Math.random() * 0.4 + 0.15,
      alpha: Math.random() * 0.35 + 0.1
    }));

    function loop() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff';
      particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  }

  // Keybindings
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowRight') {
      e.preventDefault();
      handleTapAdvance(e);
    } else if (e.code === 'KeyA') {
      toggleAutoPlay();
    } else if (e.code === 'KeyV') {
      toggleBodyView();
    }
  });

  // Init
  initParticles();
  renderTurn(0);
</script>
</body>
</html>
